<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bahlman Library</title>
<link rel="icon" type="image/png" href="_brand/favicon.png">
<style>
@font-face{font-family:"BM Display";src:local("Rafaella-Regular"),local("Rafaella Regular");font-weight:400}
@font-face{font-family:"BM Display";src:local("Rafaella-Bold"),local("Rafaella Bold");font-weight:700}
@font-face{font-family:"BM Shadow";src:local("Rafaella-BoldShadow"),local("Rafaella Bold Shadow")}
:root{--display:"BM Display",-apple-system,"SF Pro Display",system-ui,serif;--shadowface:"BM Shadow","BM Display",-apple-system,system-ui,serif;
  --bg:#08080a;--bg2:#0f0f12;--panel:#141418;--panel2:#1b1b21;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fg:#f4f4f6;--fg2:#b6b6c0;--mut:#76767f;--acc:#d79f46;--acc2:#e8b96a;--warn:#ff7a6b;
  --r:16px;--ease:cubic-bezier(.2,.7,.2,1);
  --sans:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;min-height:100vh}
/* animated backdrop */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.o1{width:70vw;height:70vw;left:-20vw;top:-35vw;background:radial-gradient(circle,rgba(215,159,70,.18),transparent 62%);animation:d1 42s ease-in-out infinite alternate}
.o2{width:60vw;height:60vw;right:-22vw;top:5vh;background:radial-gradient(circle,rgba(170,110,40,.13),transparent 62%);animation:d2 54s ease-in-out infinite alternate}
.o3{width:65vw;height:65vw;left:15vw;bottom:-40vw;background:radial-gradient(circle,rgba(240,210,150,.07),transparent 62%);animation:d3 60s ease-in-out infinite alternate}
@keyframes d1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,10vh) scale(1.15)}100%{transform:translate(4vw,22vh) scale(.95)}}
@keyframes d2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-14vw,18vh) scale(1.1)}100%{transform:translate(-6vw,-6vh) scale(1.2)}}
@keyframes d3{0%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-10vw,-14vh) scale(.9)}100%{transform:translate(12vw,-6vh) scale(1.1)}}
.grain{position:absolute;inset:-50%;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.orb,.grain{animation:none}}
/* drifting polaroids of the edited photos — faint, blurred, thrown around by scrolling */
.pola{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,#000 0,rgba(0,0,0,.35) 18%,transparent 32%,transparent 68%,rgba(0,0,0,.35) 82%,#000 100%);mask-image:linear-gradient(90deg,#000 0,rgba(0,0,0,.35) 18%,transparent 32%,transparent 68%,rgba(0,0,0,.35) 82%,#000 100%)}
.pc{position:absolute;left:0;top:0;width:150px;padding:7px 7px 24px;background:#ece5d8;border-radius:2px;box-shadow:0 14px 34px rgba(0,0,0,.55);will-change:transform,opacity;opacity:0;transition:opacity 1.6s ease}
.pc img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#2a2620;filter:sepia(.25) saturate(.45) brightness(.85)}
.pc.on{opacity:var(--o)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(8,8,10,.72);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:650;letter-spacing:-.01em;font-size:15px}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,var(--acc),var(--acc2),#c77dff,var(--acc));box-shadow:0 0 18px rgba(215,159,70,.35)}
.brand span{color:var(--mut);font-weight:500;padding-left:10px;border-left:1px solid var(--line2)}
.brand img{height:24px;display:block}
.wm{display:block;width:min(460px,72vw);height:auto;margin-bottom:26px;filter:drop-shadow(0 12px 40px rgba(215,159,70,.22))}
.crumb{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--fg);padding:0 70px 0 40px;font:inherit;font-size:14px;outline:none;transition:border-color .2s,background .2s}
.search input:focus{border-color:rgba(215,159,70,.6);background:rgba(255,255,255,.07)}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:13px;top:11px;opacity:.55}
.search kbd{position:absolute;right:10px;top:9px;font:11px var(--sans);color:var(--mut);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:9px;color:var(--fg2);font-size:13px;transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.12);color:var(--fg)}

main{position:relative;z-index:1;padding:0 28px 80px;max-width:1800px;margin:0 auto}

/* home hero */
.hero{padding:56px 0 34px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hero h1{font-size:clamp(38px,5.4vw,72px);line-height:1;letter-spacing:-.035em;font-weight:700;margin-top:12px;background:linear-gradient(180deg,#fff,#a9a9b3);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis{display:flex;gap:44px;flex-wrap:wrap;margin-top:30px}
.kpi b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12.5px;letter-spacing:.02em}

/* client grid */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.cl{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;cursor:pointer;background:var(--panel);isolation:isolate;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 50px -20px rgba(0,0,0,.8);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.cl:hover{transform:translateY(-4px);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 30px 70px -20px rgba(0,0,0,.9)}
.cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);filter:brightness(.82) saturate(.95);transition:transform 1.6s var(--ease),filter .8s var(--ease)}
.cl img.on{opacity:1}
.cl:hover img.on{transform:scale(1.09);filter:brightness(1.04) saturate(1.08)}
.cl::after{transition:opacity .6s var(--ease)}
.cl .sheen{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(233,190,110,.22) 50%,transparent 65%);transform:translateX(-120%);opacity:0}
.cl:hover .sheen{animation:sheen 1.3s var(--ease) .05s forwards}
@keyframes sheen{0%{transform:translateX(-120%);opacity:1}100%{transform:translateX(120%);opacity:0}}
.cl .info{transition:transform .6s var(--ease)}
.cl:hover .info{transform:translateY(-6px)}
.cl .nm::after{content:"";display:block;height:2px;width:0;margin-top:8px;background:var(--acc);border-radius:2px;transition:width .7s var(--ease) .1s}
.cl:hover .nm::after{width:64px}
.cl .meta{transition:opacity .5s var(--ease)}
.cl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 65%,rgba(0,0,0,.92));z-index:1}
.cl .info{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.cl .nm{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:.005em;line-height:1.05;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cl .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11.5px;color:var(--fg2);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 9px;white-space:nowrap}
.cl .go{position:absolute;top:16px;right:16px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;transform:translateY(-4px);transition:.35s var(--ease)}
.cl:hover .go{opacity:1;transform:none}

.dots i{width:14px;height:2px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .3s}
.dots i.on{background:#fff}

/* client hero */
.chero{position:relative;margin:0 -28px;padding:80px 28px 36px;overflow:hidden;isolation:isolate}
.chero .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(48px) saturate(1.5) brightness(.6);transform:scale(1.1);z-index:-2}
.chero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.2),var(--bg));z-index:-1}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font-size:13px;margin-bottom:18px;transition:color .2s}
.back:hover{color:var(--fg)}
.chero h1{font-family:var(--shadowface);font-size:clamp(46px,7vw,100px);font-weight:400;letter-spacing:.005em;line-height:1;color:var(--acc);filter:drop-shadow(0 10px 40px rgba(215,159,70,.25))}
.chero .kpis{margin-top:22px}
.chero .openf{position:absolute;top:22px;right:28px;z-index:3;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:rgba(8,8,10,.55);border:1px solid rgba(215,159,70,.5);color:#f3d9a8;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s}
.chero .openf svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.chero .openf:hover{background:var(--acc);border-color:var(--acc);color:#16110a}
@media(max-width:640px){.chero .openf{top:16px;right:16px;height:34px;padding:0 12px;font-size:10.5px;letter-spacing:.1em}}

/* filters */
.filters{position:sticky;top:69px;z-index:10;margin:0 -28px;padding:12px 28px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:rgba(8,8,10,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);font-size:13px;display:flex;align-items:center;gap:7px;transition:all .2s}
.chip:hover{border-color:rgba(255,255,255,.3);color:var(--fg)}
.chip em{font-style:normal;color:var(--mut);font-size:12px}
.chip.on{background:var(--fg);color:#0a0a0c;border-color:var(--fg)}.chip.on em{color:#55555d}

/* client layout + shoot sidebar */
.cwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.side-nav{position:sticky;top:134px;max-height:calc(100vh - 150px);overflow:auto;padding:28px 4px 20px 0;scrollbar-width:thin}
.side-nav .all{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 12px;border-radius:10px;color:var(--fg2);font-size:13.5px;font-weight:550}
.yr{margin-top:18px}
.yr .yb{display:flex;align-items:baseline;justify-content:space-between;width:100%;padding:6px 12px;border-radius:10px;font-family:var(--display);font-size:24px;font-weight:700;color:var(--acc)}
.yr .yb em,.side-nav .all em,.sh em{font-family:var(--sans);font-style:normal;font-size:11.5px;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.sh{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;padding:7px 12px;border-radius:10px;color:var(--fg2);font-size:13px;line-height:1.3;transition:background .15s,color .15s}
.sh small{grid-column:1;font-size:11px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.sh em{grid-row:1;grid-column:2}
.side-nav button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.side-nav button.on{background:rgba(215,159,70,.14);color:var(--fg)}
.side-nav button.on em{color:var(--acc)}
.shoot-select{display:none;width:100%;margin-top:18px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);padding:0 12px;font:inherit}
.yhead{font-family:var(--shadowface);font-size:clamp(40px,4.4vw,64px);font-weight:400;line-height:1;margin:48px 0 -6px;color:var(--acc);opacity:.9}
.yhead:first-child{margin-top:28px}
@media (max-width:900px){.cwrap{grid-template-columns:1fr;gap:0}.side-nav{display:none}.shoot-select{display:block}}

/* shoot sections */
.shoot{margin-top:40px;content-visibility:auto;contain-intrinsic-size:1px 900px}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.shead .date{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.shead h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.005em}
.shead .sm{color:var(--mut);font-size:13px}
.client-label{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:0;margin:48px 0 0;display:flex;align-items:baseline;gap:12px}
.client-label a{font-size:13px;color:var(--acc);font-weight:500;letter-spacing:0}

/* clip cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 14px}
.clip{cursor:pointer;min-width:0}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--panel)}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease),filter .4s}
.clip:hover .th img{transform:scale(1.06);filter:brightness(.55)}
.dur{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:2px 6px}
.vert{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:600;letter-spacing:.04em;background:rgba(215,159,70,.9);color:#1a1405;border-radius:6px;padding:2px 6px}
.flag{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.ov{position:absolute;inset:0;padding:12px;display:flex;align-items:flex-end;font-size:12.5px;line-height:1.4;color:#fff;opacity:0;transform:translateY(6px);transition:.35s var(--ease)}
.clip:hover .ov{opacity:1;transform:none}
.ov p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;padding-right:44px}
.cap{padding:9px 2px 0}
.cap .fn{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .ty{font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{padding:120px 0;text-align:center;color:var(--mut);font-size:15px}

/* viewer */
.vw{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,4,6,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:28px;overflow:auto}
.vw.open{display:block;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.vbox{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.vbox .sheet{border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#000;animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.vbox .sheet img{width:100%;display:block}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;position:sticky;top:0}
.side .id{font-size:11.5px;letter-spacing:.12em;color:var(--acc);font-weight:600;text-transform:uppercase}
.side h3{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:6px;word-break:break-all}
.side .desc{color:var(--fg2);margin-top:12px;font-size:14px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin-top:18px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{color:var(--fg);text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;color:var(--fg2)}
.warn{margin-top:14px;color:var(--warn);font-size:12.5px}
.path{margin-top:18px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;user-select:all}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:36px;border-radius:10px;display:grid;place-items:center;text-decoration:none;background:var(--fg);color:#0a0a0c;font-weight:600;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--fg);border:1px solid var(--line2)}
.x{position:fixed;top:18px;right:22px;z-index:51;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:18px}
.nav{position:fixed;top:50%;z-index:51;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px;transform:translateY(-50%)}
.nav.p{left:12px}.nav.n{right:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:#0a0a0c;font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;z-index:60;transition:.3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quick-open button on clip thumbnails */
.qopen{position:absolute;left:8px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#1a1405;background:var(--acc);opacity:0;transform:scale(.85);transition:.25s var(--ease);text-decoration:none;z-index:2}
.clip:hover .qopen{opacity:1;transform:none}.qopen:hover{filter:brightness(1.12)}
.show .acts{display:flex;gap:8px;align-items:center}
.show .acts a{height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);background:rgba(255,255,255,.12)}
.show .acts a.pri{background:var(--acc);color:#1a1405}
/* event tiles */
.mhead{display:flex;align-items:baseline;gap:14px;margin:38px 0 16px;font-family:var(--shadowface);font-weight:400;font-size:clamp(26px,2.6vw,36px);line-height:1;color:var(--acc);opacity:.9}
.mhead::after{content:'';flex:1;height:1px;background:var(--line);align-self:center}
.mhead em{font-family:var(--sans);font-style:normal;font-size:12.5px;letter-spacing:.04em;color:var(--mut);font-weight:500}
.yhead+.mhead{margin-top:22px}
.clients.mgrid{margin-bottom:6px}
.single .yhead,.single .shead{display:none}.single .shoot{margin-top:28px}
.cl.ev{aspect-ratio:16/10}
.cl.ev .nm{font-size:27px}
.cl .edate{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:650;margin-bottom:6px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.browse{display:inline-flex;align-items:center;gap:8px;margin-top:22px;height:38px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);color:var(--fg);font-size:13.5px;font-weight:600;background:rgba(255,255,255,.05);transition:.2s}
.browse:hover{background:rgba(255,255,255,.12)}

 PM={drift:pR(.5,1.6),spin:pR(.4,1.6),tilt:pR(10,26)};

 for(let i=0;i<n;i++){const el=document.createElement('div');el.className='pc';el.innerHTML='<img alt="" decoding="async">';PO.appendChild(el);
  const p={el,img:el.firstChild,src:null,z:undefined};PC.push(p);p.t=setTimeout(()=>showP(p),pR(120,RM?500:4500))}}

 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
 inp.addEventListener('input',()=>{inp.style.height='42px';inp.style.height=Math.min(120,inp.scrollHeight)+'px'});
 btn.onclick=()=>{box.classList.add('open');btn.classList.add('hide');showScope();health();if(!msgs.children.length)intro();setTimeout(()=>inp.focus(),200)};
 $('#cx').onclick=()=>{box.classList.remove('open');btn.classList.remove('hide')};
 $('#cnew').onclick=()=>{hist=[];intro()};
 addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('open')&&!vw.classList.contains('open')){box.classList.remove('open');btn.classList.remove('hide')}},true);
})();

/* === IN-LIBRARY PLAYER === */
const PAPI='http://127.0.0.1:8766';let PV=null;
/* Library server: started by the Bahlman Library app; if it isn't up, ask the app to start it (bmlib://start) and wait */
let SRV=false;const ping=()=>fetch(PAPI+'/health',{cache:'no-store'}).then(r=>SRV=r.ok).catch(()=>SRV=false);ping();
async function ensureServer(){if(SRV&&await ping())return true;
 const f=document.createElement('iframe');f.style.display='none';f.src='bmlib://start';document.body.appendChild(f);setTimeout(()=>f.remove(),4000);
 for(let k=0;k<40;k++){await new Promise(r=>setTimeout(r,500));if(await ping())return true}return false}
window.ensureServer=ensureServer;
function stopPlayer(){if(!PV)return;const v=PV.v;try{v.pause();v.removeAttribute('src');v.load()}catch(e){}PV.el.remove();PV=null;const shp=vw.querySelector('.vmain .sheet');if(shp)shp.style.display=''}
const ptime=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
async function playHere(){const r=D[cur];if(!r)return;stopPlayer();
 const box=document.createElement('div');box.className='pl'+(r.orientation==='vertical'?' v':'');
 box.innerHTML='<video playsinline preload="auto"></video><div class="pmsg">Loading…</div>';
 const shp=vw.querySelector('.vmain .sheet');if(shp)shp.style.display='none';vw.querySelector('.vmain').prepend(box);const v=box.querySelector('video'),me={el:box,v};PV=me;vw.scrollTop=0;
 const msg=h=>{let m=box.querySelector('.pmsg');if(!m){m=document.createElement('div');m.className='pmsg';box.appendChild(m)}m.innerHTML=h};
 let info;msg('Loading…');
 if(!(await ensureServer())){if(PV===me)msg('The Library player didn’t start. Open the <b>Bahlman Library</b> app from the Dock and try again.<br>Or <a href="'+bm('open',r.abs_path)+'">open this clip in QuickTime</a>.');return}
 try{info=await (await fetch(PAPI+'/probe/'+r.id)).json()}
 catch(e){msg('Couldn’t reach the Library player. <a href="'+bm('open',r.abs_path)+'">Open this clip in QuickTime</a>.');return}
 if(PV!==me)return;
 if(!info||info.missing){msg('This clip’s drive (<b>'+esc(r.drive||'Expansion')+'</b>) isn’t plugged in.');return}
 const dur=info.duration||r.duration||0;
 function direct(){box.querySelector('.pmsg')?.remove();v.controls=true;v.src=PAPI+'/clip/'+r.id;
  v.onerror=()=>{if(PV===me)stream(v.currentTime||0)};v.play().catch(()=>{})}
 function stream(t0){box.querySelector('.pmsg')?.remove();v.onerror=()=>{if(PV===me)msg('This clip couldn’t be played here. <a href="'+bm('open',r.abs_path)+'">Open it in QuickTime</a>.')};
  let off=t0;v.controls=false;
  let bar=box.querySelector('.tbar');
  if(!bar){bar=document.createElement('div');bar.className='tbar';
   bar.innerHTML='<button class="pp" aria-label="Play or pause">❚❚</button><input type="range" min="0" step="0.1"><span></span><button class="mu" aria-label="Mute">🔊</button><em title="Converted on the fly so it plays in the browser">LIVE</em>';box.appendChild(bar);
   const pp=bar.querySelector('.pp'),rg=bar.querySelector('input'),tx=bar.querySelector('span'),mu=bar.querySelector('.mu');
   rg.max=dur;let drag=false;
   const show=()=>{const now=me.off+v.currentTime;if(!drag)rg.value=now;tx.textContent=ptime(drag?rg.value:now)+' / '+ptime(dur)};
   v.ontimeupdate=show;v.onplay=()=>pp.textContent='❚❚';v.onpause=()=>pp.textContent='▶';
   pp.onclick=()=>v.paused?v.play():v.pause();v.onclick=pp.onclick;
   mu.onclick=()=>{v.muted=!v.muted;mu.textContent=v.muted?'🔇':'🔊'};
   rg.oninput=()=>{drag=true;show()};rg.onchange=()=>{drag=false;load(+rg.value)};
   let idle;box.onmousemove=()=>{box.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>{if(!v.paused)box.classList.add('idle')},2200)};
   me.show=show}
  function load(t){me.off=t;v.src=PAPI+'/play/'+r.id+'?t='+t.toFixed(2);v.play().catch(()=>{});me.show&&me.show()}
  load(off)}
 info.direct?direct():stream(0)}
</script>

 const bar=document.querySelector('header.bar'),dock=document.getElementById('dock');if(!bar||!dock)return;
